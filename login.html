<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - لوحة الإدارة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', 'Segoe UI', sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a237e, #0d47a1);
    }
    .login-box {
      background: white;
      padding: 40px 35px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
    }
    .login-box .logo {
      text-align: center;
      margin-bottom: 25px;
    }
    .login-box .logo img {
      height: 70px;
      border-radius: 12px;
    }
    .login-box .logo h2 {
      color: #1a237e;
      margin-top: 10px;
      font-size: 20px;
    }
    .login-box .logo p {
      color: #888;
      font-size: 13px;
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 14px;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      font-size: 15px;
      transition: 0.3s;
      background: #f8f9fa;
      text-align: center;
    }
    .login-box input:focus {
      border-color: #1a237e;
      outline: none;
      background: white;
      box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.1);
    }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a237e, #283593);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }
    .login-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(26, 35, 126, 0.3);
    }
    .login-box .error {
      color: #e74c3c;
      font-size: 14px;
      text-align: center;
      margin-top: 12px;
      padding: 8px;
      background: #fde8e8;
      border-radius: 8px;
      display: none;
    }
    .login-box .error.show {
      display: block;
    }
    .login-box .hint {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      margin-top: 8px;
    }
    @media (max-width: 480px) {
      .login-box {
        padding: 25px 20px;
        margin: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo">
      <img src="https://cdn.phototourl.com/free/2026-07-21-1dd4b984-ed08-4a40-aead-9ef086ebbd45.jpg" alt="شعار المنصة">
      <h2>لوحة الإدارة</h2>
      <p>الثانوية الرسمية بلس</p>
    </div>

    <form id="loginForm">
      <input type="password" id="loginPassword" placeholder="🔑 أدخل كلمة المرور" required>
      <button type="submit">🚀 دخول</button>
      <div class="error" id="loginError"></div>
      <div class="hint">💡 كلمة المرور: admin2024</div>
    </form>
  </div>

  <script>
    // ============================================================
    // 🔑 كلمة المرور الثابتة
    // ============================================================
    const ADMIN_PASSWORD = 'admin2024';

    // ============================================================
    // 📝 تسجيل الدخول
    // ============================================================
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const password = document.getElementById('loginPassword').value.trim();
      const errorEl = document.getElementById('loginError');
      errorEl.classList.remove('show');

      if (password === ADMIN_PASSWORD) {
        // ✅ دخول ناجح → حول للوحة التحكم
        window.location.href = 'dashboard.html';
      } else {
        // ❌ كلمة مرور غلط
        errorEl.textContent = '❌ كلمة المرور غير صحيحة';
        errorEl.classList.add('show');
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginPassword').focus();
      }
    });

    // ============================================================
    // 🔄 لو دخلت بالغلط، نقدر نرجع
    // ============================================================
    document.getElementById('loginPassword').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>

</body>
</html>
